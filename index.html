<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script>
(function(){
  try {
    var u = new URL(location.href);
    var deepKeys = ['material','game','additional','calendar','homeSection'];
    var isDeepLink = deepKeys.some(function(k){ return u.searchParams.has(k); }) ||
      (u.hash && u.hash !== '#home');
    var isAuthReturn = ['code','error','error_description','state'].some(function(k){ return u.searchParams.has(k); }) ||
      /(?:access_token|refresh_token|error)=/.test(u.hash);
    if (isDeepLink || isAuthReturn) {
      location.replace(new URL('platform.html' + u.search + u.hash, u).href);
    }
  } catch (e) {}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ضاد | منصة اللغة العربية</title>
</head>
<body>
<script>location.replace('welcome.html');</script>
<noscript><a href="welcome.html">الانتقال إلى صفحة استقبال ضاد</a></noscript>
</body>
</html>
