<html lang="ar" dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark;--bg:#20291c;--side:#293522;--panel:#35432b;--panel2:#3d4b31;--olive:#78864d;--gold:#d6b45f;--gold2:#ecd28c;--ink:#eee8d5;--muted:#b9bd9e;--line:#586443;--danger:#d58a72;--ok:#a8bd7c;--shadow:0 14px 34px #10170f55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--gold2)}
.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.sidebar{background:var(--side);border-left:1px solid var(--line);padding:20px 15px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:3px 6px 20px;border-bottom:1px solid var(--line)}.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#303923;display:grid;place-items:center;font-size:27px;font-weight:900}.brand h1{font-size:17px;margin:0;color:var(--gold2)}.brand p{font-size:10px;margin:3px 0 0;color:var(--muted)}
.nav-title{font-size:10px;color:var(--muted);font-weight:800;margin:19px 10px 8px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;border-radius:11px;background:transparent;color:#e0dec7;text-align:right;padding:10px 11px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800}.nav button span{width:25px;text-align:center;color:var(--gold);font-size:17px}.nav button:hover,.nav button.active{background:#465537;border-color:#65744b;color:var(--gold2)}.nav button.active{box-shadow:inset -3px 0 var(--gold)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.account{display:flex;align-items:center;gap:9px;padding:6px}.avatar{width:34px;height:34px;border-radius:50%;background:#5b633b;color:var(--gold2);display:grid;place-items:center;font-weight:900}.account strong{font-size:10px;display:block}.account small{font-size:9px;color:var(--muted);display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);background:#293522;display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:12px;position:sticky;top:0;z-index:5}.crumb{font-size:11px;color:var(--muted)}.crumb b{color:var(--gold2)}.top-actions{display:flex;align-items:center;gap:8px}.top-actions button,.btn{border:1px solid var(--line);border-radius:9px;background:#3b492f;color:var(--gold2);padding:8px 12px;font-size:10px;font-weight:800}.btn.primary,.top-actions .primary{background:var(--gold);color:#303923;border-color:var(--gold)}.btn.danger{background:#583b30;border-color:#805847;color:#f1b9a1}.btn.small{padding:5px 9px;font-size:9px}.btn:disabled{opacity:.45;cursor:not-allowed}
.content{padding:24px 25px 42px;max-width:1500px;margin:auto}.page-view{display:none}.page-view.active{display:block}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:17px}.heading h2{font-size:22px;color:var(--gold2);margin:0}.heading p{font-size:10px;color:var(--muted);margin:5px 0 0;line-height:1.9}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-head h3{font-size:12px;color:var(--gold2);margin:0}.panel-head small{font-size:9px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}.metric{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.metric label{font-size:10px;color:var(--muted)}.metric strong{display:block;font-size:25px;color:var(--gold2);margin-top:6px}.metric small{font-size:9px;color:var(--muted)}
.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--gold2);font-weight:800}.field input,.field select,.field textarea,.search{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:#263120;color:var(--ink);padding:9px 10px;font-size:10px;outline:none}.field textarea{min-height:110px;resize:vertical;line-height:1.9}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--gold)}.help{font-size:9px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.notice{border:1px solid #827044;background:#51472b;color:#f1d994;border-radius:10px;padding:10px 12px;font-size:10px;margin-bottom:13px;line-height:1.9}.notice.error{border-color:#94614d;background:#50372c;color:#f0b69e}.notice.good{border-color:#687a4a;background:#3c4a30;color:#d8e1b0}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;font-size:10px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid #52603d;vertical-align:middle}th{color:var(--gold2);background:#405033;font-weight:900;white-space:nowrap}td{color:#e2dec4}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:3px 8px;background:#4c5b39;color:#dbe2b4;font-size:9px}.tag.gold{background:#61532f;color:#f0d58b}.tag.off{background:#573a30;color:#f0b69e}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{width:min(290px,100%)}.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:10px}.empty b{display:block;color:var(--gold2);font-size:13px;margin-bottom:5px}
.card-list{display:grid;gap:8px}.item-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #52603d;border-radius:10px;background:#303c28}.item-row .emoji{font-size:19px;width:28px;text-align:center}.item-row .item-main{flex:1;min-width:0}.item-row b{font-size:10px;display:block}.item-row small{font-size:9px;color:var(--muted);display:block;line-height:1.7}.item-row .row-actions{display:flex;gap:5px;flex-wrap:wrap}
.queue-item{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:#303c28}.queue-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.queue-head b{font-size:10px;overflow-wrap:anywhere}.queue-head small{color:var(--muted);font-size:9px}
.preview{max-width:180px;max-height:90px;object-fit:contain;background:#263120;border:1px solid var(--line);border-radius:9px;padding:5px}.chart{height:160px;display:flex;align-items:flex-end;gap:6px;padding:8px 4px 20px;background:repeating-linear-gradient(to top,transparent 0,transparent 39px,#566342 40px);border-bottom:1px solid var(--line)}.bar{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;position:relative}.bar i{display:block;flex:1;border-radius:4px 4px 0 0;background:var(--olive);min-height:2px}.bar i.gold{background:var(--gold)}.bar label{position:absolute;bottom:-19px;font-size:8px;color:var(--muted);width:100%;text-align:center}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#465536 0,transparent 55%),var(--bg)}.login-card{width:min(430px,100%);background:var(--side);border:1px solid var(--line);border-radius:21px;padding:28px;box-shadow:var(--shadow);text-align:center}.login-card .brand-mark{margin:0 auto 15px}.login-card h1{color:var(--gold2);font-size:21px;margin:0}.login-card p{color:var(--muted);font-size:10px;line-height:2}.login-card button{width:100%;border:0;border-radius:11px;background:var(--gold);color:#2f3924;padding:12px;font-weight:900;font-size:11px;margin-top:12px}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--side);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.modal h3{color:var(--gold2);font-size:14px;margin:0 0 14px}.mobile-menu{display:none}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px 16px}.columns{grid-template-columns:1fr}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;width:265px;z-index:15;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px #0007}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{height:60px;padding:0 12px}.content{padding:17px 12px}.heading{flex-direction:column}.field-grid{grid-template-columns:1fr}.metrics{gap:8px}.metric{padding:11px}.metric strong{font-size:21px}.top-actions button{padding:7px 8px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><div class="login-card"><div class="brand-mark">ض</div><h1>مركز إدارة ضاد</h1><p>جارٍ التحقق من جلسة الإدارة…</p></div></div></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="actions"><button class="btn" id="modalClose">إغلاق</button></div></div></div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://rjkrfvnexrhebvulrtgp.supabase.co';
const SUPABASE_KEY='sb_publishable_INgrDnl6WPs_vNhpvwXMSA_YiHX8x7J';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ar-JO').format(Number(n||0));
const slug=s=>String(s||'file').normalize('NFKD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,55)||'file';
const date=s=>s?new Date(s).toLocaleDateString('ar-JO',{year:'numeric',month:'short',day:'numeric'}):'—';
let user=null,access={owner:false,role:'',permissions:{}},active='overview';
let materials=[],sections=[],grades=[],semesters=[],categories=[],pages=[],links=[],staff=[],storageAccounts=[],analytics=null,branding={name:'ضـــاد',tagline:'كل ما يحتاجه معلم اللغة العربية والطالب وولي الأمر',mark:'ض',logoPath:'',heroBackgroundPath:'',teacherText:'',appDownloadUrl:''},queue=[];
const views=[['overview','⌂','الرئيسية'],['brand','◈','واجهة الاستقبال'],['grades','🎓','الصفوف الدراسية'],['sections','▦','أقسام الصفحة الرئيسية'],['files','▤','إدارة الملفات'],['staff','♙','المشرفون والصلاحيات'],['storage','☁','مساحات التخزين'],['analytics','▥','لوحة الإحصائيات'],['pages','▧','صفحات الموقع'],['social','◎','مواقع التواصل']];
const ownerOnly=new Set(['brand','grades','sections','staff','storage','pages','social']);
const canOwner=()=>access.owner;
const canFiles=()=>access.owner||access.permissions?.files===true||access.role==='admin';
const canDeleteFiles=()=>access.owner||access.permissions?.file_delete===true;
async function invoke(action,payload={}){const {data,error}=await sb.functions.invoke('admin-control',{body:{action,...payload}});if(error)throw new Error(error.message||'تعذر الاتصال بالخدمة الإدارية');if(data?.error)throw new Error(data.detail||data.error);return data;}
function notice(message,type='good'){const el=$('globalNotice');if(!el)return;el.className='notice '+(type==='error'?'error':type==='good'?'good':'');el.textContent=message;el.hidden=false;window.setTimeout(()=>{if(el)el.hidden=true;},7000);}
function login(message=''){app.innerHTML='<div class="login-wrap"><section class="login-card"><div class="brand-mark">ض</div><h1>مركز إدارة ضاد</h1><p>لوحة الإدارة المستقلة لمنصة اللغة العربية<br>تسجيل دخول آمن عبر حساب Google المعتمد.</p>'+(message?'<div class="notice error">'+esc(message)+'</div>':'')+'<button id="googleLogin">المتابعة باستخدام Google</button><small class="help">لا تشارك رابط الإدارة أو بيانات الدخول مع الآخرين.</small></section></div>';$('googleLogin').onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)alert(error.message);};}
function shell(){
const nav=views.filter(v=>!ownerOnly.has(v[0])||canOwner()).filter(v=>v[0]!=='files'||canFiles());
app.innerHTML='<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">ض</div><div><h1>مركز إدارة ضاد</h1><p>إدارة المنصة التعليمية</p></div></div><div class="nav-title">أقسام لوحة التحكم</div><nav class="nav">'+nav.map(v=>'<button data-view="'+v[0]+'" class="'+(v[0]==='overview'?'active':'')+'"><span>'+v[1]+'</span>'+v[2]+'</button>').join('')+'</nav><div class="side-foot"><div class="account"><div class="avatar">ض</div><div><strong>'+esc(user.user_metadata?.full_name||user.email)+'</strong><small>'+esc(user.email)+'</small></div></div></div></aside><main class="main"><header class="topbar"><div><button class="btn mobile-menu" id="menu">☰</button> <span class="crumb">ضاد / <b id="crumb">الرئيسية</b></span></div><div class="top-actions"><button id="refresh">↻ تحديث</button><button class="primary" id="signout">خروج</button></div></header><div class="content"><div id="globalNotice" hidden></div><div id="viewRoot"></div></div></main></div>';
app.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){showView(b.dataset.view);}});$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('refresh').onclick=loadAll;$('signout').onclick=async()=>{await sb.auth.signOut();login();};
$('modalClose').onclick=closeModal;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal();};
}
function showView(name){active=name;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$('crumb').textContent=views.find(v=>v[0]===name)?.[2]||'الرئيسية';$('sidebar')?.classList.remove('open');renderView();}
function renderView(){
const root=$('viewRoot');if(!root)return;
if(active==='overview')return renderOverview(root);
if(active==='brand')return renderBrand(root);
if(active==='grades')return renderGrades(root);
if(active==='sections')return renderSections(root);
if(active==='files')return renderFiles(root);
if(active==='staff')return renderStaff(root);
if(active==='storage')return renderStorage(root);
if(active==='analytics')return renderAnalytics(root);
if(active==='pages')return renderPages(root);
if(active==='social')return renderSocial(root);
}
function panel(title,body,extra=''){return '<section class="panel"><div class="panel-head"><h3>'+title+'</h3>'+extra+'</div>'+body+'</section>';}
function renderOverview(root){
const t=analytics?.totals||{};
root.innerHTML='<div class="heading"><div><h2>مرحبًا بك في مركز إدارة ضاد</h2><p>ملخص حالة المنصة والعمليات المسجلة من قاعدة البيانات.</p></div><select id="period" class="search" style="width:150px"><option value="7">آخر 7 أيام</option><option value="30" selected>آخر 30 يومًا</option><option value="90">آخر 90 يومًا</option></select></div><div class="metrics">'+[['مشاهدات الصفحات',t.page_views],['الزوار الفريدون',t.unique_visitors],['مرات التنزيل',t.downloads],['الملفات التعليمية',materials.length]].map(x=>'<article class="metric"><label>'+x[0]+'</label><strong>'+fmt(x[1])+'</strong><small>من السجلات الحالية</small></article>').join('')+'</div><div class="columns">'+panel('مؤشرات المكتبة','<div class="card-list">'+[['الملفات',materials.length],['الصفوف',grades.length],['الأقسام',sections.length],['صفحات الموقع',pages.length]].map(x=>'<div class="item-row"><div class="item-main"><b>'+x[0]+'</b><small>السجلات الحالية</small></div><span class="tag gold">'+fmt(x[1])+'</span></div>').join('')+'</div>')+panel('إجراءات سريعة','<div class="card-list"><button class="btn" data-view="files">رفع ملفات جديدة</button><button class="btn" data-view="sections">إدارة أقسام الصفحة الرئيسية</button>'+(canOwner()?'<button class="btn" data-view="brand">تعديل واجهة الاستقبال</button><button class="btn" data-view="staff">إدارة المشرفين</button>':'')+'</div>')+'</div>'+panel('حركة الزيارات والتنزيلات','<div id="overviewChart" class="chart"></div><div class="help">الأعمدة الخضراء: مشاهدات الصفحات · الذهبية: التنزيلات</div>')+panel('أكثر الملفات تنزيلًا',topMaterialsTable());
$('period').onchange=loadAnalytics;renderChart($('overviewChart'),analytics?.daily||[]);
}
function topMaterialsTable(){const rows=analytics?.top_materials||[];return rows.length?'<div class="table-wrap"><table><thead><tr><th>الملف</th><th>التنزيلات</th><th>المشاهدات</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+fmt(x.downloads)+'</td><td>'+fmt(x.views)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">لا توجد تنزيلات مسجلة ضمن الفترة المحددة.</div>';}
function renderChart(el,daily){if(!el)return;if(!daily.length){el.innerHTML='<div class="empty">لا توجد أحداث خلال الفترة المحددة</div>';return;}const max=Math.max(1,...daily.map(x=>Math.max(+x.page_views||0,+x.downloads||0)));el.innerHTML=daily.slice(-30).map(x=>'<div class="bar"><i style="height:'+Math.max(2,(+x.page_views||0)/max*100)+'%"></i><i class="gold" style="height:'+Math.max(2,(+x.downloads||0)/max*100)+'%"></i><label>'+new Date(x.day).toLocaleDateString('ar-JO',{day:'numeric',month:'numeric'})+'</label></div>').join('');}
async function loadAnalytics(){const days=Number($('period')?.value||30);const to=new Date(),from=new Date(Date.now()-days*86400000);const {data,error}=await sb.functions.invoke('admin-analytics',{body:{from:from.toISOString(),to:to.toISOString()}});if(error)throw error;analytics=data||{};if(active==='overview'||active==='analytics')renderView();}
async function loadAll(){
try{
const results=await Promise.all([
sb.from('materials').select('id,title,description,file_name,file_type,file_size,file_path,is_public,download_count,created_at,updated_at,grade_id,semester_id,category_id,primary_section,additional_sections,content_summary,learning_objectives,target_audience,page_count').order('created_at',{ascending:false}).limit(1000),
sb.from('home_sections').select('*').order('sort_order'),
sb.from('grades').select('*').order('sort_order'),
sb.from('semesters').select('*').order('sort_order'),
sb.from('categories').select('*').order('sort_order'),
sb.from('site_pages').select('*').order('id'),
sb.from('site_contact_links').select('*').order('sort_order')
]);
const labels=['الملفات','الأقسام','الصفوف','الفصول','التصنيفات','الصفحات','روابط التواصل'];const bad=results.findIndex(x=>x.error);if(bad>=0)throw new Error(labels[bad]+': '+results[bad].error.message);
[materials,sections,grades,semesters,categories,pages,links]=results.map(x=>x.data||[]);
const brandPage=pages.find(x=>x.slug==='site-branding');if(brandPage?.content){try{branding={...branding,...JSON.parse(brandPage.content)};}catch(e){}}
await loadAnalytics();if(canOwner()){try{staff=(await invoke('staff_list')).staff||[];storageAccounts=(await invoke('storage_list')).accounts||[];}catch(e){console.warn(e);}}
renderView();notice('تم تحديث البيانات بنجاح من Supabase.','good');
}catch(e){notice('تعذر تحديث بعض البيانات: '+e.message,'error');}
}
function renderBrand(root){
if(!canOwner()){root.innerHTML='<div class="notice error">هذه الإعدادات متاحة لمالك المنصة فقط.</div>';return;}

async function uploadImage(file,folder){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('نوع الصورة غير مدعوم.');const ext=file.name.split('.').pop().toLowerCase();const path=folder+'/'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('materials').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path;}
async function saveBrand(){try{const btn=$('saveBrand');btn.disabled=true;let next={...branding,name:$('brandName').value.trim(),mark:$('brandMark').value.trim()||'ض',tagline:$('brandTagline').value.trim(),teacherText:$('brandTeacher').value.trim(),appDownloadUrl:$('brandApp').value.trim()};const logo=$('brandLogo').files[0],bg=$('brandBackground').files[0];if(logo)next.logoPath=await uploadImage(logo,'site-branding/logo');if(bg)next.heroBackgroundPath=await uploadImage(bg,'site-branding/background');const {error}=await sb.from('site_pages').update({content:JSON.stringify(next),updated_at:new Date().toISOString(),updated_by:user.id}).eq('slug','site-branding');if(error)throw error;branding=next;notice('تم حفظ إعدادات واجهة الاستقبال.','good');renderView();}catch(e){notice('تعذر الحفظ: '+e.message,'error');}finally{const b=$('saveBrand');if(b)b.disabled=false;}}

function sectionPath(id){const parts=[];let current=sections.find(x=>x.id===id),guard=0;while(current&&guard++<12){parts.unshift(current.title);current=sections.find(x=>x.id===current.parent_id);}return parts.join(' / ');}

');closeModal();await loadAll();};});

function renderFiles(root){
if(!canFiles()){root.innerHTML='<div class="notice error">لا تملك صلاحية إدارة الملفات.</div>';return;}
root.innerHTML='<div class="heading"><div><h2>إدارة الملفات</h2><p>رفع ملف واحد أو عدة ملفات، مع وصف ومسار وقسم مستقل لكل ملف.</p></div></div>'+panel('رفع الملفات','<div class="field"><label>اختر الملفات</label><input id="batchFiles" type="file" multiple><small class="help">بعد الاختيار ستظهر بطاقة مستقلة لكل ملف لتحديد عنوانه ووصفه ومساره وتصنيفه.</small></div><div id="uploadQueue"></div><div class="actions"><button class="btn primary" id="uploadBatch" disabled>بدء رفع الملفات المحددة</button></div><div id="uploadProgress" class="help"></div>')+panel('مكتبة الملفات','<div class="toolbar"><input class="search" id="fileSearch" placeholder="ابحث باسم الملف أو المادة"><span class="help">عدد الملفات: '+fmt(materials.length)+'</span></div><div class="table-wrap" id="fileTable"></div>');
$('batchFiles').onchange=buildQueue;$('uploadBatch').onclick=uploadBatch;$('fileSearch').oninput=()=>drawFileTable();
drawFileTable();
}
function buildQueue(){queue=Array.from($('batchFiles').files||[]).map((file,i)=>({file,id:i,title:file.name.replace(/\.[^.]+$/,''),description:'',section:'',grade:'',semester:'',category:'',primary:'school_grades',isPublic:true}));$('uploadQueue').innerHTML=queue.map((q,i)=>'<div class="queue-item" data-queue="'+i+'"><div class="queue-head"><b>'+esc(q.file.name)+'</b><small> · '+fmt(q.file.size)+' بايت</small></div><div class="field-grid"><div class="field"><label>عنوان المادة</label><input data-q="title" value="'+esc(q.title)+'"></div><div class="field"><label>القسم الرئيسي / الفرعي</label><select data-q="section"><option value="">— اختر القسم —</option>'+sections.map(s=>'<option value="'+s.id+'">'+esc(sectionPath(s.id))+'</option>').join('')+'</select></div><div class="field full"><label>وصف الملف (خاص بهذا الملف)</label><textarea data-q="description" placeholder="اكتب وصفًا تعليميًا واضحًا..."></textarea></div><div class="field"><label>الصف</label><select data-q="grade"><option value="">غير محدد</option>'+grades.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select></div><div class="field"><label>الفصل الدراسي</label><select data-q="semester"><option value="">غير محدد</option>'+semesters.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>التصنيف</label><select data-q="category"><option value="">غير محدد</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>التصنيف العام</label><select data-q="primary"><option value="school_grades">الصفوف الدراسية</option><option value="curricula">المناهج</option><option value="teacher_supplies">لوازم المعلمين</option><option value="interactive_games">الألعاب التفاعلية</option><option value="supplementary_education">مصادر إثرائية</option></select></div><div class="field"><label><input data-q="isPublic" type="checkbox" checked> نشر الملف للزوار</label></div></div></div>').join('');$('uploadBatch').disabled=!queue.length;}
async function uploadBatch(){
const cards=Array.from(document.querySelectorAll('[data-queue]'));cards.forEach(card=>{const i=+card.dataset.queue;for(const el of card.querySelectorAll('[data-q]')){const key=el.dataset.q;queue[i][key]=el.type==='checkbox'?el.checked:el.value;}});
const btn=$('uploadBatch');btn.disabled=true;let ok=0,failed=0;
for(let i=0;i<queue.length;i++){const q=queue[i];$('uploadProgress').textContent='جارٍ رفع '+(i+1)+' من '+queue.length+': '+q.file.name;
let path=null,savedId=null;try{
const ext=q.file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'')||'dat';const dir=[q.grade?grades.find(x=>x.id===+q.grade)?.slug:'general',q.semester?slug(semesters.find(x=>x.id===+q.semester)?.name):'all',q.section?'section-'+q.section:'uncategorized'].join('/');
path=dir+'/'+crypto.randomUUID()+'-'+slug(q.title)+'.'+ext;
const up=await sb.storage.from('materials').upload(path,q.file,{upsert:false,contentType:q.file.type||'application/octet-stream'});if(up.error)throw up.error;
const row={title:q.title.trim()||q.file.name,description:q.description.trim(),file_path:path,file_name:q.file.name,file_type:q.file.type||null,file_size:q.file.size,is_public:!!q.isPublic,created_by:user.id,grade_id:q.grade?+q.grade:null,semester_id:q.semester?+q.semester:null,category_id:q.category?+q.category:null,primary_section:q.primary,additional_sections:[]};
const saved=await sb.from('materials').insert(row).select('id').single();if(saved.error)throw saved.error;savedId=saved.data.id;
if(q.section){const link=await sb.from('home_section_materials').insert({section_id:+q.section,material_id:savedId,is_primary:true,sort_order:0});if(link.error)throw link.error;}
ok++;
}catch(e){failed++;if(savedId){await sb.from('home_section_materials').delete().eq('material_id',savedId);await sb.from('materials').delete().eq('id',savedId);}if(path)await sb.storage.from('materials').remove([path]);notice('فشل رفع '+q.file.name+': '+e.message,'error');}
}
$('uploadProgress').textContent='انتهى الرفع: نجح '+ok+'، تعذر '+failed+'.';$('batchFiles').value='';$('uploadQueue').innerHTML='';queue=[];btn.disabled=true;await loadAll();if(ok)notice('تم رفع '+ok+' ملف/ملفات بنجاح.','good');
}
function drawFileTable(){const el=$('fileTable');if(!el)return;const q=($('fileSearch')?.value||'').toLowerCase();const rows=materials.filter(m=>(m.title+' '+m.file_name+' '+(m.description||'')).toLowerCase().includes(q));el.innerHTML=rows.length?'<table><thead><tr><th>المادة</th><th>اسم الملف</th><th>الوصف</th><th>التنزيلات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>'+rows.map(m=>'<tr><td><b>'+esc(m.title)+'</b></td><td>'+esc(m.file_name)+'</td><td>'+esc((m.description||'').slice(0,65)||'—')+'</td><td>'+fmt(m.download_count)+'</td><td><span class="tag '+(m.is_public?'gold':'off')+'">'+(m.is_public?'منشور':'مخفي')+'</span></td><td><button class="btn small" data-edit-file="'+m.id+'">تعديل</button> '+(canDeleteFiles()?'<button class="btn small danger" data-delete-file="'+m.id+'">حذف</button>':'')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">لا توجد ملفات مطابقة.</div>';
el.querySelectorAll('[data-edit-file]').forEach(b=>b.onclick=()=>editFile(b.dataset.editFile));el.querySelectorAll('[data-delete-file]').forEach(b=>b.onclick=()=>deleteFile(b.dataset.deleteFile));}
function editFile(id){const m=materials.find(x=>x.id===id);openModal('تعديل بيانات الملف','<div class="field-grid"><div class="field"><label>عنوان المادة</label><input id="efTitle" value="'+esc(m.title)+'"></div><div class="field"><label>اسم الملف</label><input disabled value="'+esc(m.file_name)+'"></div><div class="field full"><label>الوصف</label><textarea id="efDesc">'+esc(m.description||'')+'</textarea></div><div class="field"><label>الصف</label><select id="efGrade"><option value="">غير محدد</option>'+grades.map(g=>'<option value="'+g.id+'" '+(m.grade_id===g.id?'selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></div><div class="field"><label>الفصل</label><select id="efSemester"><option value="">غير محدد</option>'+semesters.map(s=>'<option value="'+s.id+'" '+(m.semester_id===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>التصنيف</label><select id="efCategory"><option value="">غير محدد</option>'+categories.map(c=>'<option value="'+c.id+'" '+(m.category_id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label><input id="efPublic" type="checkbox" '+(m.is_public?'checked':'')+'> منشور للزوار</label></div></div><div class="actions"><button class="btn primary" id="saveFile">حفظ</button></div>');$('saveFile').onclick=async()=>{const {error}=await sb.from('materials').update({title:$('efTitle').value.trim(),description:$('efDesc').value.trim(),grade_id:$('efGrade').value?+$('efGrade').value:null,semester_id:$('efSemester').value?+$('efSemester').value:null,category_id:$('efCategory').value?+$('efCategory').value:null,is_public:$('efPublic').checked,updated_at:new Date().toISOString()}).eq('id',m.id);if(error)return notice(error.message,'error');closeModal();await loadAll();};}
async function deleteFile(id){const m=materials.find(x=>x.id===id);if(!confirm('حذف «'+m.title+'»؟ سيتم حذف سجل الملف وروابطه وملفه المخزن.'))return;const {data:oldLinks,error:readLinksError}=await sb.from('home_section_materials').select('section_id,material_id,sort_order,is_primary').eq('material_id',id);if(readLinksError)return notice(readLinksError.message,'error');const unlink=await sb.from('home_section_materials').delete().eq('material_id',id);if(unlink.error)return notice(unlink.error.message,'error');const {error}=await sb.from('materials').delete().eq('id',id);if(error){if(oldLinks?.length)await sb.from('home_section_materials').insert(oldLinks);return notice('تعذر حذف سجل الملف: '+error.message,'error');}const rm=await sb.storage.from('materials').remove([m.file_path]);await loadAll();notice(rm.error?'حُذف السجل، لكن تعذر حذف الملف المخزن: '+rm.error.message:'تم حذف الملف وسجله وروابط أقسامه.','good');}
function renderStaff(root){if(!canOwner()){root.innerHTML='<div class="notice error">إدارة المشرفين متاحة للمالك فقط.</div>';return;}root.innerHTML='<div class="heading"><div><h2>المشرفون والصلاحيات</h2><p>إضافة مشرف عبر بريده الإلكتروني واسمه، دون مشاركة كلمة مرور.</p></div></div><div class="notice">عند إضافة بريد جديد، يرسل النظام دعوة تسجيل عبر Supabase Auth. صلاحية الحذف منفصلة ولا تُمنح افتراضيًا.</div>'+panel('إضافة مشرف ملفات','<div class="field-grid"><div class="field"><label>اسم المشرف</label><input id="staffName" placeholder="اسم المشرف"></div><div class="field"><label>البريد الإلكتروني</label><input id="staffEmail" type="email" placeholder="name@example.com"></div></div><div class="actions"><button class="btn primary" id="addStaff">إرسال الدعوة وإضافة المشرف</button></div>')+panel('المشرفون المسجلون','<div class="card-list">'+(staff.length?staff.map(s=>'<div class="item-row"><div class="item-main"><b>'+esc(s.display_name)+'</b><small>'+esc(s.email)+' · '+(s.permissions?.files?'إدارة الملفات':'دون صلاحية الملفات')+' · '+(s.permissions?.file_delete?'يمكنه الحذف':'لا يملك الحذف')+'</small></div><span class="tag '+(s.status==='active'?'gold':'off')+'">'+esc(s.status)+'</span><div class="row-actions"><button class="btn small" data-edit-staff="'+s.id+'">صلاحيات</button><button class="btn small danger" data-disable-staff="'+s.id+'">تعطيل</button></div></div>').join(''):'<div class="empty">لا يوجد مشرفون إضافيون.</div>')+'</div>');
$('addStaff').onclick=async()=>{try{const b=$('addStaff');b.disabled=true;const r=await invoke('staff_invite',{email:$('staffEmail').value,display_name:$('staffName').value});notice(r.invitation_sent?'أُضيف المشرف وأُرسلت دعوة إلى بريده.':'أُضيف الحساب الموجود كمشرف ملفات.','good');await loadAll();}catch(e){notice(e.message,'error');}finally{if($('addStaff'))$('addStaff').disabled=false;}};
root.querySelectorAll('[data-edit-staff]').forEach(b=>b.onclick=()=>{const s=staff.find(x=>x.id===b.dataset.editStaff);openModal('تعديل صلاحيات المشرف','<div class="field"><label>اسم المشرف</label><input id="staffEditName" value="'+esc(s.display_name)+'"></div><div class="field"><label><input id="staffFiles" type="checkbox" '+(s.permissions?.files?'checked':'')+'> إدارة الملفات والرفع والتعديل</label></div><div class="field"><label><input id="staffDelete" type="checkbox" '+(s.permissions?.file_delete?'checked':'')+'> حذف الملفات (صلاحية حساسة)</label></div><div class="actions"><button class="btn primary" id="saveStaff">حفظ الصلاحيات</button></div>');$('saveStaff').onclick=async()=>{try{await invoke('staff_update',{id:s.id,display_name:$('staffEditName').value,permissions:{files:$('staffFiles').checked,file_delete:$('staffDelete').checked}});closeModal();await loadAll();notice('تم تحديث الصلاحيات.','good');}catch(e){notice(e.message,'error');}};});
root.querySelectorAll('[data-disable-staff]').forEach(b=>b.onclick=async()=>{const s=staff.find(x=>x.id===b.dataset.disableStaff);if(!confirm('تعطيل صلاحية '+s.email+'؟'))return;try{await invoke('staff_disable',{id:s.id});await loadAll();}catch(e){notice(e.message,'error');}});
}
function renderStorage(root){if(!canOwner()){root.innerHTML='<div class="notice error">إدارة التخزين متاحة للمالك فقط.</div>';return;}root.innerHTML='<div class="heading"><div><h2>مساحات التخزين</h2><p>إدارة مساحة Supabase وإعداد سجلات حسابات Google Drive الإضافية.</p></div></div><div class="notice">مهم: إضافة حساب Drive إلى القائمة لا تعني اكتمال الربط OAuth. الربط الفعلي يتطلب إعداد Google OAuth Client ID وClient Secret في أسرار الخادم؛ لن نخزن رموز الدخول في المتصفح أو في جدول عام.</div>'+panel('التخزين الحالي','<div class="item-row"><span class="emoji">☁</span><div class="item-main"><b>Supabase Storage · materials</b><small>المساحة الأساسية الحالية للملفات</small></div><span class="tag gold">نشط</span></div>')+panel('إضافة حساب Google Drive','<div class="field-grid"><div class="field"><label>اسم مساحة التخزين</label><input id="driveLabel" placeholder="تخزين 1"></div><div class="field"><label>البريد المرتبط بالحساب (اختياري)</label><input id="driveEmail" type="email" placeholder="drive@example.com"></div></div><div class="actions"><button class="btn primary" id="addDrive">إضافة مساحة التخزين</button></div>')+panel('حسابات التخزين الإضافية','<div class="card-list">'+(storageAccounts.length?storageAccounts.map(a=>'<div class="item-row"><span class="emoji">📁</span><div class="item-main"><b>'+esc(a.label)+'</b><small>'+esc(a.account_email||'لم يحدد بريد')+' · '+esc(a.provider)+'</small></div><span class="tag '+(a.status==='connected'?'gold':'off')+'">'+esc(a.status)+'</span><button class="btn small" data-rename-storage="'+a.id+'">تسمية</button><button class="btn small danger" data-disconnect-storage="'+a.id+'">فصل</button></div>').join(''):'<div class="empty">لم تتم إضافة مساحات إضافية بعد.</div>')+'</div>');
$('addDrive').onclick=async()=>{try{const r=await invoke('storage_add',{label:$('driveLabel').value,account_email:$('driveEmail').value});await loadAll();notice(r.message||'تم تسجيل مساحة التخزين.','good');}catch(e){notice(e.message,'error');}};
root.querySelectorAll('[data-rename-storage]').forEach(b=>b.onclick=()=>{const a=storageAccounts.find(x=>x.id===b.dataset.renameStorage);openModal('تعديل مساحة التخزين','<div class="field"><label>الاسم</label><input id="storageLabel" value="'+esc(a.label)+'"></div><div class="field"><label>البريد</label><input id="storageEmail" value="'+esc(a.account_email||'')+'"></div><div class="actions"><button class="btn primary" id="saveStorage">حفظ</button></div>');$('saveStorage').onclick=async()=>{try{await invoke('storage_update',{id:a.id,label:$('storageLabel').value,account_email:$('storageEmail').value});closeModal();await loadAll();}catch(e){notice(e.message,'error');}};});
root.querySelectorAll('[data-disconnect-storage]').forEach(b=>b.onclick=async()=>{if(!confirm('فصل مساحة التخزين هذه من القائمة؟'))return;try{await invoke('storage_disconnect',{id:b.dataset.disconnectStorage});await loadAll();}catch(e){notice(e.message,'error');}});
}
function renderAnalytics(root){const t=analytics?.totals||{};root.innerHTML='<div class="heading"><div><h2>لوحة الإحصائيات</h2><p>تقارير الزيارات والتنزيلات الحقيقية المسجلة، للإدارة فقط.</p></div><select id="period" class="search" style="width:150px"><option value="7">آخر 7 أيام</option><option value="30" selected>آخر 30 يومًا</option><option value="90">آخر 90 يومًا</option></select></div><div class="metrics">'+[['مشاهدات الصفحات',t.page_views],['زوار فريدون',t.unique_visitors],['التنزيلات',t.downloads],['معاينات الملفات',t.previews]].map(x=>'<article class="metric"><label>'+x[0]+'</label><strong>'+fmt(x[1])+'</strong></article>').join('')+'</div>'+panel('الحركة اليومية','<div id="analyticsChart" class="chart"></div>')+'<div class="columns">'+panel('أكثر الصفحات زيارة','<div class="card-list">'+(analytics?.top_pages||[]).map(x=>'<div class="item-row"><div class="item-main"><b>'+esc(x.path)+'</b></div><span class="tag gold">'+fmt(x.views)+'</span></div>').join('')+'</div>')+panel('مصادر الزيارات','<div class="card-list">'+(analytics?.referrers||[]).map(x=>'<div class="item-row"><div class="item-main"><b>'+esc(x.source)+'</b></div><span class="tag gold">'+fmt(x.visits)+'</span></div>').join('')+'</div>')+'</div>'+panel('الأجهزة المستخدمة','<div class="card-list">'+(analytics?.devices||[]).map(x=>'<div class="item-row"><div class="item-main"><b>'+esc(x.device_type)+'</b></div><span class="tag gold">'+fmt(x.events)+'</span></div>').join('')+'</div>');$('period').onchange=loadAnalytics;renderChart($('analyticsChart'),analytics?.daily||[]);}
function renderPages(root){if(!canOwner()){root.innerHTML='<div class="notice error">إدارة الصفحات متاحة لمالك المنصة فقط.</div>';return;}const editable=pages.filter(p=>['about','privacy','contact','home-description'].includes(p.slug));root.innerHTML='<div class="heading"><div><h2>صفحات الموقع</h2><p>تحرير صفحات من نحن وسياسة الخصوصية واتصل بنا.</p></div></div>'+panel('الصفحات','<div class="card-list">'+editable.map(p=>'<div class="item-row"><div class="item-main"><b>'+esc(p.title)+'</b><small>'+esc(p.slug)+' · '+(p.is_visible?'ظاهرة':'مخفية')+'</small></div><button class="btn small" data-edit-page="'+p.slug+'">تحرير الصفحة</button></div>').join('')+'</div>');root.querySelectorAll('[data-edit-page]').forEach(b=>b.onclick=()=>{const p=pages.find(x=>x.slug===b.dataset.editPage);openModal('تحرير '+p.title,'<div class="field"><label>عنوان الصفحة</label><input id="pageTitle" value="'+esc(p.title)+'"></div><div class="field"><label>المحتوى</label><textarea id="pageContent" style="min-height:300px">'+esc(p.content||'')+'</textarea><small class="help">يمكن استخدام فواصل الأسطر والعناوين والنصوص. احفظ بعد المراجعة.</small></div><div class="field"><label><input id="pageVisible" type="checkbox" '+(p.is_visible?'checked':'')+'> إظهار الصفحة للزوار</label></div><div class="actions"><button class="btn primary" id="savePage">حفظ الصفحة</button></div>');$('savePage').onclick=async()=>{const {error}=await sb.from('site_pages').update({title:$('pageTitle').value.trim(),content:$('pageContent').value,is_visible:$('pageVisible').checked,updated_at:new Date().toISOString(),updated_by:user.id}).eq('id',p.id);if(error)return notice(error.message,'error');closeModal();await loadAll();};});}
function renderSocial(root){if(!canOwner()){root.innerHTML='<div class="notice error">إدارة روابط التواصل متاحة لمالك المنصة فقط.</div>';return;}root.innerHTML='<div class="heading"><div><h2>مواقع التواصل الاجتماعي</h2><p>تعديل عناوين الروابط الظاهرة في الموقع وإضافة روابط جديدة.</p></div></div>'+panel('روابط التواصل','<div class="card-list">'+links.map(l=>'<div class="item-row"><div class="item-main"><b>'+esc(l.title)+'</b><small>'+esc(l.url||'لم يحدد رابط')+'</small></div><button class="btn small" data-edit-link="'+esc(l.key)+'">تعديل</button></div>').join('')+'</div>')+panel('إضافة رابط جديد','<div class="field-grid"><div class="field"><label>المعرّف (key)</label><input id="newLinkKey" placeholder="instagram"></div><div class="field"><label>اسم المنصة</label><input id="newLinkTitle" placeholder="إنستغرام"></div><div class="field full"><label>الرابط</label><input id="newLinkUrl" placeholder="https://..."></div></div><div class="actions"><button class="btn primary" id="addLink">إضافة الرابط</button></div>');root.querySelectorAll('[data-edit-link]').forEach(b=>b.onclick=()=>{const l=links.find(x=>x.key===b.dataset.editLink);openModal('تعديل رابط '+l.title,'<div class="field"><label>اسم المنصة</label><input id="linkTitle" value="'+esc(l.title)+'"></div><div class="field"><label>الرابط</label><input id="linkUrl" value="'+esc(l.url)+'"></div><div class="field"><label>الترتيب</label><input id="linkOrder" type="number" value="'+(+l.sort_order||0)+'"></div><div class="actions"><button class="btn primary" id="saveLink">حفظ</button></div>');$('saveLink').onclick=async()=>{const {error}=await sb.from('site_contact_links').update({title:$('linkTitle').value.trim(),url:$('linkUrl').value.trim(),sort_order:+$('linkOrder').value||0,updated_by:user.id,updated_at:new Date().toISOString()}).eq('key',l.key);if(error)return notice(error.message,'error');closeModal();await loadAll();};});$('addLink').onclick=async()=>{const key=$('newLinkKey').value.trim().toLowerCase(),title=$('newLinkTitle').value.trim(),url=$('newLinkUrl').value.trim();if(!key||!title)return notice('أدخل المعرّف واسم المنصة.','error');const {error}=await sb.from('site_contact_links').insert({key,title,url,sort_order:links.length+1,updated_by:user.id});if(error)return notice(error.message,'error');await loadAll();};}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBackdrop').style.display='flex';}function closeModal(){$('modalBackdrop').style.display='none';$('modalBody').innerHTML='';}
async function start(){const {data,error}=await sb.auth.getSession();if(error)return login(error.message);if(!data.session)return login();user=data.session.user;try{const a=await invoke('my_access');if(!a.allowed)return login('هذا الحساب غير مخوّل بالدخول إلى لوحة الإدارة.');access=a;}catch(e){return login('تعذر التحقق من صلاحية الحساب: '+e.message);}shell();await loadAll();showView('overview');}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')login();});
start();
})();
</script>
</body>
</html>
