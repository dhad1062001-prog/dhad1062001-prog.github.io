<style>
:root{color-scheme:dark;--bg:#20291c;--side:#293522;--panel:#35432b;--panel2:#3d4b31;--olive:#78864d;--olive2:#a0a96e;--gold:#d6b45f;--gold2:#ecd28c;--ink:#eee5c9;--muted:#b9bd9e;--line:#586443;--danger:#d58a72;--shadow:0 16px 38px #10170f66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--gold2)}
.shell{min-height:100vh;display:grid;grid-template-columns:265px minmax(0,1fr)}.sidebar{background:var(--side);border-left:1px solid var(--line);padding:24px 17px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:2px 7px 23px;border-bottom:1px solid var(--line)}.brand-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#303923;display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:0 7px 18px #1118}.brand h1{font-size:18px;margin:0;color:var(--gold2)}.brand p{font-size:10px;margin:3px 0 0;color:var(--muted)}
.nav-title{font-size:10px;color:var(--muted);font-weight:800;margin:23px 11px 9px;letter-spacing:.3px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;border-radius:12px;background:transparent;color:#d9d9bc;text-align:right;padding:11px 12px;display:flex;align-items:center;gap:11px;font-size:12px;font-weight:700}.nav button span{width:24px;text-align:center;color:var(--gold);font-size:17px}.nav button:hover,.nav button.active{background:#465537;border-color:#65744b;color:var(--gold2)}.nav button.active{box-shadow:inset -3px 0 var(--gold)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.account{display:flex;align-items:center;gap:10px;padding:7px}.avatar{width:36px;height:36px;border-radius:50%;background:#5b633b;color:var(--gold2);display:grid;place-items:center;font-weight:900}.account strong{font-size:11px;display:block}.account small{font-size:9px;color:var(--muted);display:block;max-width:165px;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);background:#293522;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--gold2)}.top-actions{display:flex;align-items:center;gap:9px}.top-actions button{border:1px solid var(--line);border-radius:10px;background:#3b492f;color:var(--gold2);padding:9px 13px;font-size:11px;font-weight:800}.top-actions .gold-btn{background:var(--gold);color:#303923;border-color:var(--gold)}
.content{padding:27px 30px 40px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.heading h2{font-size:23px;color:var(--gold2);margin:0}.heading p{font-size:11px;color:var(--muted);margin:5px 0 0}.period{border:1px solid var(--line);background:var(--panel);color:var(--gold2);border-radius:10px;padding:9px 12px;font-size:11px}
.notice{border:1px solid #827044;background:#51472b;color:#f1d994;border-radius:12px;padding:11px 14px;font-size:11px;margin-bottom:17px;line-height:1.8}.notice.error{border-color:#94614d;background:#50372c;color:#f0b69e}.notice.good{border-color:#687a4a;background:#3c4a30;color:#d8e1b0}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:16px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-25px;bottom:-43px;background:#4a5938}.metric-label{font-size:10px;color:var(--muted);font-weight:700}.metric-icon{float:left;width:33px;height:33px;border-radius:11px;background:#4a5938;color:var(--gold2);display:grid;place-items:center;font-size:16px}.metric strong{display:block;font-size:26px;color:var(--gold2);margin:9px 0 0;position:relative;z-index:1}.metric small{font-size:9px;color:var(--muted)}
.columns{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:15px;margin-bottom:15px}.panel{padding:17px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-head h3{font-size:13px;color:var(--gold2);margin:0}.panel-head small{font-size:9px;color:var(--muted)}
.daily{display:flex;align-items:flex-end;gap:8px;height:190px;padding:12px 5px 25px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 44px,#566342 45px)}.day{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}.day i{display:block;width:min(15px,42%);min-height:2px;border-radius:5px 5px 0 0;background:var(--olive2)}.day i.gold{background:var(--gold)}.day label{position:absolute;bottom:-23px;font-size:8px;color:var(--muted);white-space:nowrap}.legend{display:flex;gap:14px;margin-top:28px;font-size:9px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--olive2);margin-left:5px}.dot.gold{background:var(--gold)}
.quick{display:grid;gap:9px}.quick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #53603e}.quick-row:last-child{border:0}.quick-ico{width:33px;height:33px;border-radius:10px;background:#4a5938;color:var(--gold2);display:grid;place-items:center}.quick-row b{display:block;font-size:10px}.quick-row small{display:block;color:var(--muted);font-size:9px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px;font-size:10px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #52603d}th{color:var(--gold2);background:#405033;font-weight:800}td{color:#e2dec4}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:3px 8px;background:#4c5b39;color:#dbe2b4;font-size:9px}.tag.gold{background:#61532f;color:#f0d58b}
.page-view{display:none}.page-view.active{display:block}.empty{padding:34px 15px;text-align:center;color:var(--muted);font-size:11px}.empty strong{display:block;color:var(--gold2);font-size:14px;margin-bottom:7px}.search{background:#293522;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;width:min(270px,100%);font-size:10px}.list-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#465536 0,transparent 55%),var(--bg)}.login-card{width:min(440px,100%);background:var(--side);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow);text-align:center}.login-card .brand-mark{margin:0 auto 16px}.login-card h1{color:var(--gold2);font-size:22px;margin:0}.login-card p{color:var(--muted);font-size:11px;line-height:2}.login-card button{width:100%;border:0;border-radius:12px;background:var(--gold);color:#2f3924;padding:13px;font-weight:900;font-size:12px;margin-top:13px}.login-card small{display:block;color:var(--muted);font-size:9px;margin-top:15px}
.loading{padding:40px;text-align:center;color:var(--gold2)}.spinner{width:25px;height:25px;border:3px solid #596744;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.mobile-menu{display:none}.mobile-nav{display:none}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.content{padding:22px 18px}}
@media(max-width:720px){.mobile-nav{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;background:#293522;border-bottom:1px solid var(--line);scrollbar-width:thin}.mobile-nav button{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;background:#35432b;color:var(--ink);padding:8px 13px;font-size:10px;font-weight:800}.mobile-nav button.active{background:var(--gold);color:#303923;border-color:var(--gold)}.shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;width:270px;z-index:10;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px #0007}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{height:64px;padding:0 13px}.content{padding:19px 13px}.heading{flex-direction:column}.top-actions button{padding:8px}.daily{gap:4px}}
@media(max-width:420px){.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:22px}.metric-label{font-size:9px}.top-actions .hide-mobile{display:none}}
</style>
</head>

<script>

function shell(){
app.innerHTML='<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">ض</div><div><h1>مركز إدارة ضاد</h1><p>إدارة المنصة التعليمية</p></div></div><div class="nav-title">مساحة العمل</div><nav class="nav"><button class="active" data-view="overview"><span>⌂</span>نظرة عامة</button><button data-view="files"><span>▤</span>مكتبة الملفات</button><button data-view="sections"><span>▦</span>الأقسام والتصنيفات</button><button data-view="pages"><span>▧</span>صفحات المنصة</button><button data-view="analytics"><span>▥</span>التحليلات</button></nav><div class="side-foot"><div class="account"><div class="avatar">ض</div><div><strong>حساب الإدارة</strong><small>'+esc(currentUser.email)+'</small></div></div></div></aside><main class="main"><header class="topbar"><div><button class="mobile-menu" id="menu">☰</button> <span class="crumb">ضاد / <b id="crumb">نظرة عامة</b></span></div><div class="top-actions"><button id="refresh">↻ تحديث البيانات</button><button id="signout" class="gold-btn">تسجيل الخروج</button></div></header><nav class="mobile-nav" id="mobileNav"><button data-view="overview" class="active">الرئيسية</button><button data-view="files">الملفات</button><button data-view="sections">الأقسام</button><button data-view="pages">الصفحات</button><button data-view="analytics">التحليلات</button></nav><div class="content"><section class="page-view active" id="view-overview"><div class="heading"><div><h2>مرحبًا بك في مركز إدارة ضاد</h2><p>مؤشرات حقيقية من قاعدة البيانات وسجل الزيارات والتنزيلات.</p></div><select class="period" id="period"><option value="7">آخر 7 أيام</option><option value="30" selected>آخر 30 يومًا</option><option value="90">آخر 90 يومًا</option></select></div><div id="status"></div><div class="metrics" id="metrics"><article class="metric"><div class="metric-label">مشاهدات الصفحات</div><strong>—</strong></article><article class="metric"><div class="metric-label">الزوار الفريدون</div><strong>—</strong></article><article class="metric"><div class="metric-label">مرات التنزيل</div><strong>—</strong></article><article class="metric"><div class="metric-label">الملفات التعليمية</div><strong>—</strong></article></div><div class="columns"><section class="panel"><div class="panel-head"><h3>حركة الزيارات والتنزيلات</h3><small>بيانات يومية فعلية</small></div><div id="chart" class="daily"><div class="empty">بانتظار تحميل الإحصائيات</div></div><div class="legend"><span><i class="dot"></i>مشاهدات الصفحات</span><span><i class="dot gold"></i>التنزيلات</span></div></section><section class="panel"><div class="panel-head"><h3>ملخص المكتبة</h3><small>السجلات الحالية</small></div><div class="quick" id="librarySummary"></div></section></div><section class="panel"><div class="panel-head"><h3>أكثر الملفات تنزيلًا</h3><small>ضمن الفترة المختارة</small></div><div class="table-wrap" id="topMaterials"></div></section></section><section class="page-view" id="view-files"><div class="heading"><div><h2>مكتبة الملفات</h2><p>عرض مباشر للمواد الموجودة دون تعديل أو حذف.</p></div></div><div class="panel"><div class="list-tools"><input id="fileSearch" class="search" placeholder="ابحث باسم المادة أو الملف…"><span class="muted" id="fileCount"></span></div><div class="table-wrap" id="filesTable"></div></div></section><section class="page-view" id="view-sections"><div class="heading"><div><h2>الأقسام والتصنيفات</h2><p>قراءة بيانات التصنيفات والأقسام الحالية كما هي.</p></div></div><div class="columns"><section class="panel"><div class="panel-head"><h3>الأقسام الرئيسية والفرعية</h3></div><div id="sectionsList" class="quick"></div></section><section class="panel"><div class="panel-head"><h3>التصنيفات الدراسية</h3></div><div id="categoriesList" class="quick"></div></section></div><div class="columns"><section class="panel"><div class="panel-head"><h3>الصفوف</h3></div><div id="gradesList" class="quick"></div></section><section class="panel"><div class="panel-head"><h3>الفصول الدراسية</h3></div><div id="semestersList" class="quick"></div></section></div></section><section class="page-view" id="view-pages"><div class="heading"><div><h2>صفحات المنصة</h2><p>عرض صفحات الموقع ومحتواها المسجل دون إجراء تغييرات.</p></div></div><div class="panel"><div class="table-wrap" id="pagesTable"></div></div></section><section class="page-view" id="view-analytics"><div class="heading"><div><h2>التحليلات</h2><p>تفاصيل الزيارات والتنزيلات ومصادر الوصول والأجهزة.</p></div></div><div class="columns"><section class="panel"><div class="panel-head"><h3>أكثر الصفحات زيارة</h3></div><div id="topPages" class="quick"></div></section><section class="panel"><div class="panel-head"><h3>مصادر الزيارات</h3></div><div id="referrers" class="quick"></div></section></div><section class="panel"><div class="panel-head"><h3>الأجهزة المستخدمة</h3></div><div id="devices" class="quick"></div></section></section></div></main></div>';
app.addEventListener('click',event=>{const button=event.target.closest('button[data-view]');if(button){event.preventDefault();showView(button.dataset.view);}});
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('refresh').onclick=loadAll;
document.getElementById('signout').onclick=async()=>{await client.auth.signOut();loginScreen();};
document.getElementById('period').onchange=loadAnalytics;
document.getElementById('fileSearch').oninput=renderFiles;
}
function showView(view){
activeView=view;document.querySelectorAll('.page-view').forEach(x=>x.classList.toggle('active',x.id==='view-'+view));
document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
const names={overview:'نظرة عامة',files:'مكتبة الملفات',sections:'الأقسام والتصنيفات',pages:'صفحات المنصة',analytics:'التحليلات'};
document.getElementById('crumb').textContent=names[view]||'';
document.getElementById('sidebar').classList.remove('open');
}
function listRows(items,empty){
if(!items||!items.length)return '<div class="empty">'+(empty||'لا توجد بيانات مسجلة')+'</div>';
return items.map(x=>'<div class="quick-row"><span class="quick-ico">◆</span><div><b>'+esc(x.name||x.title||x.source||x.path||'—')+'</b><small>'+esc(x.detail||'')+'</small></div><span class="tag">'+fmt(x.count||x.events||x.views||0)+'</span></div>').join('');
}
async function loadAnalytics(){
const days=Number(document.getElementById('period').value||30);
const to=new Date(),from=new Date(Date.now()-days*86400000);
const result=await client.functions.invoke('admin-analytics',{body:{from:from.toISOString(),to:to.toISOString()}});
if(result.error){document.getElementById('status').innerHTML='<div class="notice error">تعذر تحميل الإحصائيات: '+esc(result.error.message||'تحقق من صلاحية الحساب والاتصال.')+'</div>';return;}
analytics=result.data||{};renderAnalytics();
}
function renderAnalytics(){
const t=analytics.totals||{};
const cards=[['مشاهدات الصفحات','◉',t.page_views],['الزوار الفريدون','♙',t.unique_visitors],['مرات التنزيل','⇩',t.downloads],['الملفات التعليمية','▤',materials.length]];
document.getElementById('metrics').innerHTML=cards.map(c=>'<article class="metric"><span class="metric-icon">'+c[1]+'</span><div class="metric-label">'+c[0]+'</div><strong>'+fmt(c[2])+'</strong><small>حسب البيانات المحفوظة</small></article>').join('');
const daily=analytics.daily||[],max=Math.max(1,...daily.map(d=>Math.max(Number(d.page_views||0),Number(d.downloads||0))));
document.getElementById('chart').innerHTML=daily.length?daily.map(d=>'<div class="day"><i style="height:'+Math.max(2,Number(d.page_views||0)/max*100)+'%"></i><i class="gold" style="height:'+Math.max(2,Number(d.downloads||0)/max*100)+'%"></i><label>'+new Date(d.day).toLocaleDateString('ar-JO',{day:'numeric',month:'numeric'})+'</label></div>').join(''):'<div class="empty">لا توجد أحداث خلال هذه الفترة</div>';
const top=analytics.top_materials||[];
document.getElementById('topMaterials').innerHTML=top.length?'<table><thead><tr><th>المادة</th><th>التنزيلات</th><th>المشاهدات</th></tr></thead><tbody>'+top.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+fmt(x.downloads)+'</td><td>'+fmt(x.views)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">لا توجد تنزيلات مسجلة في الفترة المختارة</div>';
document.getElementById('topPages').innerHTML=listRows((analytics.top_pages||[]).map(x=>({name:x.path,count:x.views})));
document.getElementById('referrers').innerHTML=listRows((analytics.referrers||[]).map(x=>({name:x.source,count:x.visits})));
document.getElementById('devices').innerHTML=listRows((analytics.devices||[]).map(x=>({name:x.device_type,count:x.events})));
document.getElementById('status').innerHTML='<div class="notice good">تم جلب الإحصائيات من خدمة الإدارة المحمية. هذه أرقام الأحداث المسجلة، وليست تقديرات.</div>';
}
function renderFiles(){
const q=(document.getElementById('fileSearch')?.value||'').trim().toLowerCase();
const rows=materials.filter(m=>(m.title+' '+m.file_name).toLowerCase().includes(q));
document.getElementById('fileCount').textContent='عدد النتائج: '+fmt(rows.length);
document.getElementById('filesTable').innerHTML=rows.length?'<table><thead><tr><th>عنوان المادة</th><th>اسم الملف</th><th>الوصف</th><th>التنزيلات</th><th>الحالة</th><th>تاريخ الإضافة</th></tr></thead><tbody>'+rows.map(m=>'<tr><td><b>'+esc(m.title)+'</b></td><td>'+esc(m.file_name)+'</td><td>'+esc((m.description||'').slice(0,75)||'—')+'</td><td>'+fmt(m.download_count)+'</td><td><span class="tag '+(m.is_public?'gold':'')+'">'+(m.is_public?'منشور':'مخفي')+'</span></td><td>'+date(m.created_at)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">لا توجد ملفات مطابقة لبحثك.</div>';
}
function renderSimpleLists(){
document.getElementById('sectionsList').innerHTML=listRows(sections.map(s=>({name:s.title,detail:(s.section_description||'')+' · '+(s.is_active?'نشط':'غير نشط'),count:s.sort_order})));
document.getElementById('categoriesList').innerHTML=listRows(categories.map(s=>({name:s.name,detail:'المعرّف: '+s.id,count:s.sort_order})));
document.getElementById('gradesList').innerHTML=listRows(grades.map(s=>({name:s.name,detail:s.slug||'',count:s.sort_order})));
document.getElementById('semestersList').innerHTML=listRows(semesters.map(s=>({name:s.name,detail:'الفصل الدراسي',count:s.sort_order})));
document.getElementById('pagesTable').innerHTML=pages.length?'<table><thead><tr><th>الصفحة</th><th>الرابط</th><th>حالة الظهور</th><th>آخر تحديث</th></tr></thead><tbody>'+pages.map(p=>'<tr><td><b>'+esc(p.title)+'</b></td><td>'+esc(p.slug)+'</td><td><span class="tag '+(p.is_visible?'gold':'')+'">'+(p.is_visible?'ظاهرة':'مخفية')+'</span></td><td>'+date(p.updated_at)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">لا توجد صفحات مسجلة.</div>';
document.getElementById('librarySummary').innerHTML=[['المواد التعليمية',materials.length],['الأقسام',sections.length],['التصنيفات',categories.length],['الصفوف',grades.length],['الفصول الدراسية',semesters.length],['صفحات الموقع',pages.length]].map(x=>'<div class="quick-row"><span class="quick-ico">◆</span><div><b>'+x[0]+'</b><small>سجلات موجودة في قاعدة البيانات</small></div><span class="tag gold">'+fmt(x[1])+'</span></div>').join('');
}
async function loadAll(){
document.getElementById('status').innerHTML='<div class="notice">جارٍ تحديث البيانات من Supabase…</div>';
const queries=await Promise.all([
client.from('materials').select('id,title,description,file_name,file_type,file_size,file_path,is_public,download_count,created_at,updated_at').order('created_at',{ascending:false}).limit(500),
client.from('home_sections').select('id,title,section_description,is_active,sort_order,parent_id').order('sort_order'),
client.from('categories').select('id,name,slug,sort_order').order('sort_order'),
client.from('grades').select('id,name,slug,sort_order').order('sort_order'),
client.from('semesters').select('id,name,sort_order').order('sort_order'),
client.from('site_pages').select('id,slug,title,is_visible,updated_at').order('id')
]);
const names=['المواد','الأقسام','التصنيفات','الصفوف','الفصول','الصفحات'];
const err=queries.findIndex(q=>q.error);
if(err>=0){document.getElementById('status').innerHTML='<div class="notice error">تعذر تحميل '+names[err]+': '+esc(queries[err].error.message)+'</div>';return;}
[materials,sections,categories,grades,semesters,pages]=queries.map(q=>q.data||[]);
renderFiles();renderSimpleLists();await loadAnalytics();
}
async function start(){
const {data,error}=await client.auth.getSession();
if(error){loginScreen(error.message);return;}
const session=data.session;
if(!session){loginScreen();return;}
const user=session.user,email=(user.email||'').toLowerCase();
if(!ALLOWED.includes(email)){await client.auth.signOut();loginScreen('هذا الحساب غير مخوّل للدخول إلى مركز الإدارة.');return;}
currentUser=user;shell();await loadAll();
}
client.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_OUT'){loginScreen();return;}
if(event==='SIGNED_IN'&&session){const email=(session.user.email||'').toLowerCase();if(!ALLOWED.includes(email)){client.auth.signOut();loginScreen('هذا الحساب غير مخوّل للدخول إلى مركز الإدارة.');}}
});
start();
})();
</script>
